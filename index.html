<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ದೃಶ್ಯಪಾಠ — ಪಾಠದ ಪ್ರಸ್ತುತಿ ತಯಾರಕ</title>
<meta name="description" content="ದೃಶ್ಯಪಾಠ: ಪಾಠದ ಪಠ್ಯದಿಂದ ಆಕರ್ಷಕ ಪ್ರಸ್ತುತಿ (PPT) ತಯಾರಿಸುವ ಉಚಿತ ಸಾಧನ — ಮಾಹಿತಿ ಒಂದೂ ಬಿಡದೆ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@400;600;700&family=Baloo+Tamma+2:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Serif+Kannada:wght@400;700&family=Tiro+Kannada&display=swap" rel="stylesheet">
<style>
:root{--ui:#4F5BD5;--ui2:#3B46B8;--cta:#F26B1D;--ink:#1D2233;--mut:#6B7285;--line:#E2E5EE;--bgc:#EEF0F6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Kannada','Nirmala UI','Tunga',system-ui,sans-serif;background:var(--bgc);color:var(--ink);overflow:hidden;font-size:14px}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hide{display:none!important}

/* ---------- top bar ---------- */
#top{height:56px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#151A2D;color:#fff;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;font-family:'Anek Kannada','Noto Sans Kannada',sans-serif;cursor:pointer;white-space:nowrap}
.brand .lg{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#FF8A3D,#F2385A);display:grid;place-items:center;font-size:18px}
#deckTitle{background:transparent;border:1px solid transparent;color:#fff;font-size:15px;padding:6px 8px;border-radius:8px;min-width:120px;flex:1;max-width:420px}
#deckTitle:hover,#deckTitle:focus{border-color:#3A4160;outline:none;background:#1E2440}
.tb{background:#242B45;color:#fff;border:0;border-radius:9px;padding:8px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{background:#2F3757}
.tb.cta{background:var(--cta)}
.tb.cta:hover{background:#DB5B10}
.tb.pri{background:var(--ui)}
.tb.pri:hover{background:var(--ui2)}
.tb:disabled{opacity:.4;cursor:default}
.sp{flex:1}

/* ---------- layout ---------- */
#app{height:100vh;display:flex;flex-direction:column}
#main{flex:1;display:grid;grid-template-columns:190px 1fr 300px;min-height:0}
#thumbs{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 10px 80px}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#ins{height:50px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.ib{background:#F3F4F9;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{background:#E8EAF5;border-color:#CDD2E5}
.ib:disabled{opacity:.4}
#wrap{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;box-shadow:0 10px 40px rgba(20,25,50,.18);touch-action:none}
#panel{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px 14px 90px}

/* ---------- slide rendering ---------- */
.sl{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden}
.el{position:absolute;user-select:none;-webkit-user-select:none}
.el .bx{position:absolute;inset:0;display:flex;flex-direction:column}
.el .tx{overflow-wrap:anywhere;word-break:normal}
.el .tx p{margin:0 0 .35em}
.el .tx p:last-child{margin-bottom:0}
.el .tx p.b{position:relative;padding-left:1.1em}
.el .tx p.b::before{content:'•';position:absolute;left:.15em;top:0;color:var(--bc)}
.el .im{position:absolute;inset:0;overflow:hidden}
.el .im img{width:100%;height:100%;display:block;pointer-events:none}
.el .im .bd{position:absolute;inset:0;pointer-events:none}
.el .cr.rc{right:auto;left:50%;transform:translateX(-50%);bottom:14%}
.el .cr{position:absolute;right:6px;bottom:5px;font:11px/1.2 'Noto Sans Kannada',sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el .ph{position:absolute;inset:0;border:3px dashed #9AA3BF;border-radius:inherit;background:rgba(240,242,250,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5A6383;font:22px/1.5 'Noto Sans Kannada',sans-serif;padding:10px}
.el .ph small{font-size:16px;opacity:.75}
.mode-view .el .ph{display:none}
.mode-edit .el:not(.lk){cursor:move}
.mode-edit .el.over{outline:3px dashed #E5484D;outline-offset:2px}
.mode-edit .el.lk{pointer-events:none}

/* selection */
#ov{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;outline:2px solid #3D7BFF;pointer-events:none}
.hd{position:absolute;background:#fff;border:2px solid #3D7BFF;border-radius:50%;pointer-events:auto;touch-action:none}
.hd.rt{background:#3D7BFF;cursor:grab}
.guide{position:absolute;background:#FF2E93;pointer-events:none}
#tedit{position:absolute;border:2px solid #3D7BFF;background:rgba(255,255,255,.96);color:#111;resize:none;outline:none;z-index:5;padding:6px;margin:0}

/* thumbs */
.th{position:relative;margin:0 0 12px 22px;border-radius:8px;cursor:pointer}
.th .n{position:absolute;left:-20px;top:2px;font-size:12px;color:var(--mut);width:16px;text-align:right}
.th .box{width:150px;height:84.375px;border-radius:7px;overflow:hidden;position:relative;border:2px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#fff}
.th.on .box{border-color:var(--ui)}
.th .mini{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(.1171875);transform-origin:0 0;pointer-events:none}
.th .ta{position:absolute;right:4px;top:4px;display:none;gap:3px}
.th:hover .ta,.th.on .ta{display:flex}
.th .ta button{border:0;background:rgba(20,25,45,.75);color:#fff;border-radius:6px;width:24px;height:24px;font-size:12px;padding:0}
.th.drop{box-shadow:0 -4px 0 var(--cta)}
.addsl{width:150px;margin-left:22px;border:2px dashed #C9CEE0;background:#F7F8FC;border-radius:8px;padding:10px;color:var(--ui);font-weight:600}

/* panel */
.pt{font-weight:700;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.pg{border-top:1px solid var(--line);padding:12px 0 4px}
.pg>label,.lbl{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600}
.rw{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rw input[type=number]{width:70px;padding:6px;border:1px solid var(--line);border-radius:8px}
.rw input[type=range]{flex:1;min-width:100px}
.rw select{flex:1;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.sb{border:1px solid var(--line);background:#F5F6FA;border-radius:8px;padding:6px 9px;min-width:34px}
.sb:hover{background:#ECEEF6}
.sb.on{background:var(--ui);color:#fff;border-color:var(--ui)}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sw button{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.15);padding:0}
.sw button.on{outline:2px solid var(--ui);outline-offset:2px}
.sw .none{background:linear-gradient(135deg,#fff 45%,#E5484D 47%,#E5484D 53%,#fff 55%)}
.sw input[type=color]{width:28px;height:26px;border:0;padding:0;background:none}
textarea.nt{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btnrow .sb{text-align:center}
.danger{color:#C62828}
.hint{font-size:12px;color:var(--mut);line-height:1.6}
.sugg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.sugg img{width:100%;height:56px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
.sugg img:hover{border-color:var(--ui)}

/* popover menu */
.pop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,50,.2);padding:6px;z-index:60;min-width:200px;max-height:70vh;overflow:auto}
.pop button.mi{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;gap:10px;align-items:center;color:var(--ink)}
.pop button.mi:hover{background:#F0F2FA}
.pop .sep{height:1px;background:var(--line);margin:5px 4px}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:330px}
.emg button{font-size:24px;border:0;background:none;padding:4px;border-radius:8px}
.emg button:hover{background:#F0F2FA}
.emh{font-size:12px;color:var(--mut);font-weight:700;padding:6px 6px 2px;grid-column:1/-1}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(14,18,35,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:18px;width:min(900px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:19px;flex:1;font-family:'Anek Kannada','Noto Sans Kannada',sans-serif}
.mx{border:0;background:#F0F2F8;width:34px;height:34px;border-radius:10px;font-size:16px}
.mb{padding:18px 20px;overflow:auto}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{margin-bottom:12px}
.fld label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid #D5D9E6;border-radius:10px;background:#fff}
.fld textarea{min-height:200px;resize:vertical;line-height:1.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:#EEF0F7;color:var(--ink)}
.btn:hover{background:#E3E6F2}
.btn.pri{background:var(--ui);color:#fff}
.btn.pri:hover{background:var(--ui2)}
.btn.cta{background:var(--cta);color:#fff}
.btn.cta:hover{background:#DB5B10}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#F6F7FB;border-radius:999px;padding:8px 14px;font-weight:600}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step{background:#F7F8FC;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.step h4{margin:0 0 8px;font-size:15px}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thc{border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;padding:0;text-align:left}
.thc.on{border-color:var(--ui);box-shadow:0 0 0 3px rgba(79,91,213,.2)}
.thc .pv{height:64px;position:relative}
.thc .pv i{position:absolute;left:10px;top:12px;width:60%;height:9px;border-radius:5px}
.thc .pv b{position:absolute;left:10px;top:28px;width:28px;height:4px;border-radius:2px}
.thc .pv u{position:absolute;right:10px;bottom:9px;width:30px;height:30px;border-radius:50%}
.thc span{display:block;padding:6px 9px;font-size:13px;font-weight:600}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.igrid .it{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#F2F3F8;position:relative}
.igrid .it:hover{border-color:var(--ui)}
.igrid img{width:100%;height:110px;object-fit:cover;display:block}
.igrid .it span{display:block;font-size:11px;padding:4px 6px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{display:flex;gap:8px;margin-bottom:12px}
.srch input{flex:1;padding:10px 12px;border:1px solid #D5D9E6;border-radius:10px}
.cov{border-radius:14px;padding:16px;margin-bottom:12px}
.cov.ok{background:#E9F8EF;border:1px solid #A6DFBB}
.cov.warn{background:#FFF6E6;border:1px solid #F5CF85}
.cov .big{font-size:30px;font-weight:800}
.miss{max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.miss li{margin:4px 0;line-height:1.6}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#151A2D;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;transition:opacity .25s;opacity:0;pointer-events:none}
#toast.on{opacity:1}

/* home */
#home{position:fixed;inset:0;z-index:40;overflow:auto;background:radial-gradient(1200px 600px at 10% -10%,#FFE3CF 0,transparent 60%),radial-gradient(900px 600px at 100% 0,#DCE2FF 0,transparent 60%),#F6F7FB}
.hin{max-width:1060px;margin:0 auto;padding:28px 20px 60px}
.hhead{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.hhead .lg{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#FF8A3D,#F2385A);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px rgba(242,56,90,.35)}
.hhead h1{margin:0;font-size:34px;font-family:'Anek Kannada','Noto Sans Kannada',sans-serif;line-height:1.1}
.hhead p{margin:2px 0 0;color:var(--mut)}
.hero{font-size:22px;font-weight:700;margin:0 0 6px;font-family:'Anek Kannada','Noto Sans Kannada',sans-serif}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:16px 0 26px}
.hc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;box-shadow:0 4px 18px rgba(30,40,80,.06);transition:transform .15s,box-shadow .15s}
.hc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(30,40,80,.12)}
.hc .ic{font-size:30px;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px}
.hc h3{margin:0 0 6px;font-size:17px}
.hc p{margin:0;color:var(--mut);font-size:13px;line-height:1.6}
.sample{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#7A3E1D,#3E1F0E);color:#FFF6E5;border-radius:18px;padding:18px 22px;border:0;width:100%;text-align:left;margin-bottom:26px}
.sample:hover{filter:brightness(1.08)}
.sample .ic{font-size:34px}
.sample b{display:block;font-size:18px;font-family:'Noto Serif Kannada','Noto Sans Kannada',serif}
.sample span{opacity:.85;font-size:13px}
.recent h3{margin:0 0 10px}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ri{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ri .t{flex:1;min-width:0;cursor:pointer}
.ri .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .t small{color:var(--mut)}
.ri button{border:0;background:#F6E8E8;color:#B42318;border-radius:8px;padding:6px 8px}
.foot{margin-top:30px;color:var(--mut);font-size:12px;line-height:1.8}

/* present */
#pres{position:fixed;inset:0;background:#000;z-index:100;display:none;cursor:none}
#pres.on{display:block}
#pres.cur{cursor:default}
#pst{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#pst .sl{transition:opacity .35s}
#pnav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(20,22,35,.75);color:#fff;padding:6px 10px;border-radius:12px;opacity:0;transition:opacity .3s}
#pres.cur #pnav{opacity:1}
#pnav button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:7px 11px}
#pnotes{position:absolute;left:0;right:0;bottom:0;background:rgba(15,18,30,.92);color:#fff;padding:14px 22px 60px;font-size:20px;line-height:1.6;display:none;max-height:40%;overflow:auto;white-space:pre-wrap}
#pbar{position:absolute;left:0;top:0;height:4px;background:var(--cta);transition:width .3s}
#pblack{position:absolute;inset:0;background:#000;display:none}

/* responsive */
#mtog{display:none}
@media (max-width:980px){
  #main{grid-template-columns:1fr}
  #thumbs{position:fixed;left:0;right:0;bottom:0;height:118px;border-right:0;border-top:1px solid var(--line);display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:10px;z-index:15}
  .th{margin:0;flex:0 0 auto}
  .th .n{display:none}
  .addsl{margin:0;flex:0 0 auto;height:88px}
  #panel{position:fixed;right:0;top:56px;bottom:118px;width:min(320px,92vw);z-index:16;box-shadow:-10px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s}
  #panel.open{transform:none}
  #mtog{display:inline-flex}
  #wrap{margin-bottom:118px}
  .tb .lb{display:none}
  .g2,.g3{grid-template-columns:1fr}
  #deckTitle{min-width:0;flex:1 1 40px}
  #top{gap:4px;padding:0 6px}
  .brand span:last-child{display:none}
  .tb{padding:8px 9px}
  #bUndo,#bRedo{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand" id="goHome" title="ಮುಖಪುಟ"><span class="lg">📽️</span><span>ದೃಶ್ಯಪಾಠ</span></div>
    <input id="deckTitle" placeholder="ಪ್ರಸ್ತುತಿಯ ಹೆಸರು">
    <button class="tb" id="bUndo" title="ಹಿಂದಕ್ಕೆ (Ctrl+Z)">↶</button>
    <button class="tb" id="bRedo" title="ಮುಂದಕ್ಕೆ (Ctrl+Y)">↷</button>
    <div class="sp"></div>
    <button class="tb" id="bTheme">🎨 <span class="lb">ವಿನ್ಯಾಸ</span></button>
    <button class="tb" id="bCheck" title="ಪಾಠದ ಎಲ್ಲಾ ಮಾಹಿತಿ ಬಂದಿದೆಯೇ ಪರೀಕ್ಷಿಸಿ">✅ <span class="lb">ಮಾಹಿತಿ ಪರಿಶೀಲನೆ</span></button>
    <button class="tb pri" id="bDown">⬇ <span class="lb">ಡೌನ್‌ಲೋಡ್</span></button>
    <button class="tb cta" id="bPlay">▶ <span class="lb">ಪ್ರದರ್ಶನ</span></button>
    <button class="tb" id="mtog">⚙</button>
  </div>
  <div id="main">
    <div id="thumbs"></div>
    <div id="center">
      <div id="ins">
        <button class="ib" data-ins="title">🔠 ಶೀರ್ಷಿಕೆ</button>
        <button class="ib" data-ins="text">✏️ ಪಠ್ಯ</button>
        <button class="ib" data-ins="bullets">☰ ಅಂಶಗಳ ಪಟ್ಟಿ</button>
        <button class="ib" data-ins="image">🖼️ ಚಿತ್ರ</button>
        <button class="ib" data-ins="shape">⬛ ಆಕಾರ</button>
        <button class="ib" data-ins="icon">😀 ಚಿಹ್ನೆ</button>
        <span style="width:1px;height:26px;background:var(--line);margin:0 4px"></span>
        <button class="ib" id="bNew">✨ ಹೊಸ ಪಾಠ</button>
      </div>
      <div id="wrap"><div id="stage"></div></div>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div id="home"></div>
<div id="pres"><div id="pst"></div><div id="pblack"></div><div id="pbar"></div><div id="pnotes"></div>
  <div id="pnav"><button data-p="prev">◀</button><span id="pnum"></span><button data-p="next">▶</button><button data-p="notes" title="ಶಿಕ್ಷಕರ ಟಿಪ್ಪಣಿ (N)">📝</button><button data-p="fs" title="ಪೂರ್ಣ ಪರದೆ (F)">⛶</button><button data-p="exit">✕ ನಿರ್ಗಮಿಸಿ</button></div>
</div>

function parseAI(txt) {
  let s = txt.replace(/```(?:json)?/gi, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a < 0 || b < a) throw new Error('JSON ಸಿಗಲಿಲ್ಲ');
  s = s.slice(a, b + 1);
  try { return JSON.parse(s); } catch (e) { }
  s = s.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1');
  return JSON.parse(s);
}

/* ------------------------------------------------- coverage checker */
function deckAllText(deck) {
  const out = [];
  deck.slides.forEach(s => s.els.forEach(e => { if (e.t === 'text' && !e.dyn) out.push(e.text); }));
  return out.join(' ');
}
function coverage(source, deck) {
  const norm = s => s.replace(/[^ಀ-೿a-zA-Z0-9]+/g, ' ').trim();
  const dset = new Set();
  norm(deckAllText(deck)).split(' ').forEach(w => { for (let k = 3; k <= Math.min(6, w.length); k++) dset.add(w.slice(0, k)); if (w.length < 3) dset.add(w); });
  const sents = parseSections(source).flatMap(sec => sec.items);
  const miss = []; let tot = 0, hit = 0;
  sents.forEach(s => {
    const ws = norm(s).split(' ').filter(w => w.length >= 3); if (ws.length < 3) return;
    tot++; const k = ws.filter(w => dset.has(w.slice(0, Math.min(6, w.length)))).length;
    if (k / ws.length >= 0.6) hit++; else miss.push(s);
  });
  const deckNums = new Set((deckAllText(deck).match(/\d+/g) || []));
  const missNums = [...new Set((source.match(/\d+/g) || []).filter(n => !deckNums.has(n)))];
  return { pct: tot ? Math.round(hit / tot * 100) : 100, tot, miss, missNums };
}

function initKeys() {
  document.addEventListener('keydown', ev => {
    if (PR.on) {
      const k = ev.key;
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { ev.preventDefault(); presGo(1); }
      else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { ev.preventDefault(); presGo(-1); }
      else if (k === 'Home') { PR.i = 0; presShow(); } else if (k === 'End') { PR.i = D.slides.length - 1; presShow(); }
      else if (k === 'Escape') presStop();
      else if (k === 'n' || k === 'N') { PR.notes = !PR.notes; presShow(); }
      else if (k === 'b' || k === 'B' || k === '.') { const b = $('#pblack'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
      else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => { }); }
      return;
    }
    if (!D || !$('#home').classList.contains('hide') || $('.mbg')) return;
    const tg = ev.target; if (tg.matches('input,textarea,select,[contenteditable]')) return;
    const mod = ev.ctrlKey || ev.metaKey;
    if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
    if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
    if (ev.key === 'F5') { ev.preventDefault(); presStart(ev.shiftKey ? st.cur : 0); return; }
    const e = selEl();
    if (mod && ev.key.toLowerCase() === 'd' && e) { ev.preventDefault(); dupSel(); return; }
    if (mod && ev.key.toLowerCase() === 'c' && e) { clip = JSON.parse(JSON.stringify(e)); return; }
    if (mod && ev.key.toLowerCase() === 'v' && clip) { const c = JSON.parse(JSON.stringify(clip)); c.id = uid(); c.x += 20; c.y += 20; delete c.lock; delete c.chrome; addEl(c); return; }
    if (e && (ev.key === 'Delete' || ev.key === 'Backspace')) { ev.preventDefault(); delSel(); return; }
    if (e && ev.key === 'Enter' && e.t === 'text') { ev.preventDefault(); startTextEdit(e); return; }
    if (e && ev.key.startsWith('Arrow')) { ev.preventDefault(); const d = ev.shiftKey ? 10 : 1; if (ev.key === 'ArrowLeft') e.x -= d; if (ev.key === 'ArrowRight') e.x += d; if (ev.key === 'ArrowUp') e.y -= d; if (ev.key === 'ArrowDown') e.y += d; renderStage(); commitLater(); return; }
    if (!e && (ev.key === 'ArrowDown' || ev.key === 'PageDown')) { ev.preventDefault(); goSlide(st.cur + 1); return; }
    if (!e && (ev.key === 'ArrowUp' || ev.key === 'PageUp')) { ev.preventDefault(); goSlide(st.cur - 1); return; }
    if (ev.key === 'Escape') { st.sel = null; drawSel(); renderPanel(); }
  });
}

  $('#fImg').addEventListener('change', async ev => { const f = ev.target.files[0]; ev.target.value = ''; if (!f || !D) return; try { const url = await readImageFile(f); const id = uid(); D.assets[id] = url; applyImage({ src: 'asset:' + id, credit: '', q: '' }, imgTarget); } catch (e) { toast('⚠️ ಚಿತ್ರ ತೆರೆಯಲು ಆಗಲಿಲ್ಲ'); } });

  await renderHome();
}

    { type: 'content', heading: 'ಸ್ಥಾಪಕ ಮತ್ತು ಪ್ರಸಿದ್ಧ ಚಕ್ರವರ್ತಿ', imageQuery: 'Pulakeshin II', highlight: 'ಸಂಸ್ಥಾಪಕ: ರಾಜಾ ಜಯಸಿಂಹ  •  ಅತ್ಯಂತ ಶಕ್ತಿಶಾಲಿ ಚಕ್ರವರ್ತಿ: ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ', points: ['ರಾಜಾ ಜಯಸಿಂಹನು ಈ ವಂಶದ ಸಂಸ್ಥಾಪಕನು.', 'ಈ ರಾಜವಂಶದ ಅತ್ಯಂತ ಶಕ್ತಿಶಾಲಿ ಮತ್ತು ಹೆಸರಾಂತ ಚಕ್ರವರ್ತಿಯೆಂದರೆ ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ.', 'ಗಂಗರು, ಕದಂಬರು ಮತ್ತು ಅಳುಪರನ್ನು ಗೆದ್ದು, ಈತನು ತನ್ನ ಚಕ್ರಾಧಿಪತ್ಯವನ್ನು ವಿಸ್ತರಿಸಿದನು.'] },
    { type: 'content', heading: 'ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯ ವಿಜಯಗಳು', imageQuery: 'Narmada river', points: ['ದಕ್ಷಿಣ ದಖ್ಖನ್ನಿನಲ್ಲಿ ಪಲ್ಲವರು ತಮ್ಮ ವೈಭವ ಕಾಲದಲ್ಲಿದ್ದರು.', 'ದೊರೆ ಮಹೇಂದ್ರವರ್ಮನು ಪುಲಕೇಶಿಯ ಪರಮಾಧಿಕಾರತ್ವವನ್ನು ಒಪ್ಪಿಕೊಳ್ಳದ ಕಾರಣ ಪುಲಕೇಶಿಯು ಆತನನ್ನು ಸೋಲಿಸಿದನು.', 'ಉತ್ತರ ಭಾರತವನ್ನು ಆಳುತ್ತಿದ್ದ ಹರ್ಷವರ್ಧನನನ್ನು ನರ್ಮದಾ ನದಿಯ ದಂಡೆಯಲ್ಲಿ ತಡೆಗಟ್ಟಿ ಸೋಲಿಸಿದನು.'], highlight: 'ಬಿರುದುಗಳು: ‘ದಕ್ಷಿಣಾ ಪಥೇಶ್ವರ’, ‘ತ್ರಿಸಾಗರಗಳಿಂದಾವೃತವಾದ ಪ್ರದೇಶದ ಅಧಿಪತಿ’' },
    { type: 'content', heading: 'ವೆಂಗಿಯ ಚಾಳುಕ್ಯರು', points: ['ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಗೆ ತನ್ನ ಚಕ್ರಾಧಿಪತ್ಯವೆಲ್ಲವನ್ನೂ ಒಂದೇ ಕೇಂದ್ರದಿಂದ ಆಳಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.', 'ಆದುದರಿಂದ ತನ್ನ ತಮ್ಮನಾದ ಕುಬ್ಜ ವಿಷ್ಣುವರ್ಧನನನ್ನು ವೆಂಗಿಗೆ ಮತ್ತು ಜಯಸಿಂಹನನ್ನು ಗುಜರಾತ್ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಅಧಿಕಾರಿಗಳನ್ನಾಗಿ ನೇಮಿಸಿದನು.', 'ಮುಂದಿನ ವರ್ಷಗಳಲ್ಲಿ ಇದು ‘ವೆಂಗಿಯ ಚಾಳುಕ್ಯರು’ ಎನ್ನುವ ಹೆಸರಿನಲ್ಲಿ ಸುಮಾರು ಐದು ಶತಮಾನಗಳ ಕಾಲ ರಾಜ್ಯಭಾರ ನಡೆಸಿತು.'] },
    { type: 'content', heading: 'ಹ್ಯೂಯೆನ್‌ತ್ಸಾಂಗನ ವಿವರಣೆ', imageQuery: 'Xuanzang', points: ['ಹ್ಯೂಯೆನ್‌ತ್ಸಾಂಗನು ಚಾಳುಕ್ಯ ರಾಜಧಾನಿಗೆ ಭೇಟಿ ನೀಡಿದ್ದನು. ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ ಮತ್ತು ಚಾಳುಕ್ಯ ರಾಜ್ಯದ ಬಗ್ಗೆ ವಿವರಣೆಗಳನ್ನು ನೀಡಿದ್ದಾನೆ.', 'ದೊರೆಯು ನ್ಯಾಯವಾದಿ ಹಾಗೂ ಕರುಣಾಳುವಾಗಿದ್ದನು.', 'ಸೈನ್ಯವು ಶಿಸ್ತಿನಿಂದ ಕೂಡಿದ್ದು, ಸೈನಿಕರು ಮರಣಕ್ಕೆ ಹೆದರದೆ ಕಾದಾಡುವ ಯೋಧರಾಗಿದ್ದರು.', 'ಪ್ರಜೆಗಳು ಸತ್ಯಪ್ರಿಯರು, ಸಂತೋಷಚಿತ್ತರು, ಸ್ವಾಭಿಮಾನಿಗಳು, ಸಂಪದ್ಭರಿತರು, ಗೌರವ ಪ್ರಿಯರು ಮತ್ತು ರಾಜನಿಷ್ಠರಾಗಿದ್ದರು.', 'ರಾಜನಲ್ಲಿ ಅತ್ಯಂತ ಗೌರವ, ಅಂತೆಯೇ ರಾಜನಿಗೆ ಪ್ರಜೆಗಳಲ್ಲಿ ಅಪಾರ ಪ್ರೀತಿ ಇದ್ದಿತು ಎಂದು ಬರೆದಿದ್ದಾನೆ.'] },
    { type: 'content', heading: 'ವಿದೇಶಿ ಸಂಬಂಧಗಳು ಮತ್ತು ಚಾಳುಕ್ಯರ ಪತನ', imageQuery: 'Ajanta Persian embassy painting', points: ['ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯು ಆಶಾವಾದಿ ಚಕ್ರವರ್ತಿಯಾಗಿದ್ದನು. ವಿದೇಶಿ ದೊರೆಗಳೊಂದಿಗೂ ಸ್ನೇಹಮಯ ಸಂಬಂಧಗಳನ್ನು ಹೊಂದಿದ್ದನು.', 'ಪರ್ಷಿಯನ್ ದೊರೆಯಾದ ಇಮ್ಮಡಿ ಖುಸ್ರುವಿನೊಡನೆ ರಾಯಭಾರಿ ಸಂಬಂಧಗಳನ್ನು ಹೊಂದಿದ್ದನೆಂದು ಅರಬ್ ಇತಿಹಾಸಕಾರರು ತಿಳಿಸುತ್ತಾರೆ.', 'ತಂದೆ ಮಹೇಂದ್ರವರ್ಮನಿಗೆ ಉಂಟಾದ ಸೋಲಿಗೆ ಪಲ್ಲವರ ದೊರೆಯಾದ ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮನು ಸೇಡು ತೀರಿಸಿಕೊಂಡನು; ಚಾಳುಕ್ಯ ರಾಜ್ಯವನ್ನು ಆಕ್ರಮಿಸಿ ವಾತಾಪಿಯನ್ನು ವಶಪಡಿಸಿಕೊಂಡನು.', 'ಚಾಳುಕ್ಯರ ಕಡೆಯ ದೊರೆ ಕೀರ್ತಿವರ್ಮನ ಕಾಲದಲ್ಲಿ ರಾಷ್ಟ್ರಕೂಟರು ಈ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಆಕ್ರಮಿಸಿದರು.'] },

    { type: 'content', heading: 'ಚಾಳುಕ್ಯರ ಕೊಡುಗೆಗಳು', points: ['ಕನ್ನಡ ನಾಡು, ನುಡಿ, ಸಂಸ್ಕೃತಿಗಳನ್ನು ಬೆಳೆಸಿ, ಪೋಷಿಸಿ, ರಕ್ಷಿಸಿ, ಧರ್ಮ, ಸಾಹಿತ್ಯ, ಕಲೆ, ವಾಸ್ತುಶಿಲ್ಪದಲ್ಲಿ ಅಗಾಧ ಕೊಡುಗೆ ನೀಡಿದವರು.', 'ಅವರ ಸೈನ್ಯವನ್ನು ‘ಕರ್ಣಾಟಬಲ’ ಎಂದು ಕರೆಯಲಾಗಿತ್ತು.', 'ಕರ್ನಾಟಕ ಚರಿತ್ರೆಯಲ್ಲಿ ಬಾದಾಮಿ ಚಾಳುಕ್ಯರ ಆಳ್ವಿಕೆ ಅತ್ಯಂತ ಶ್ರೇಷ್ಠವೂ ವೈಭವಯುಕ್ತವೂ ಆದ ಒಂದು ಯುಗ.', 'ಈ ಯುಗವು ಸೈನಿಕ ಕ್ಷೇತ್ರದಲ್ಲಿ ಅಲ್ಲದೆ ಕಲೆ ಮತ್ತು ಸಾಹಿತ್ಯ ರಂಗಗಳಲ್ಲಿಯೂ ಹಾಗೆಯೇ ಗಮನಾರ್ಹವಾದುದು.'] },
    { type: 'flow', heading: 'ಚಾಳುಕ್ಯರ ಆಡಳಿತ ವ್ಯವಸ್ಥೆ', points: ['ರಾಜ – ಸಕ್ರಿಯವಾಗಿ ಆಡಳಿತದಲ್ಲಿ ಭಾಗವಹಿಸುತ್ತಿದ್ದನು', 'ವಿಷಯ (ಜಿಲ್ಲೆ) – ರಾಜ್ಯವನ್ನು ವಿಷಯಗಳಾಗಿ ವಿಂಗಡಿಸಲಾಗಿತ್ತು; ವಿಷಯಾಧಿಪತಿಯು ಉಸ್ತುವಾರಿ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದನು', 'ಗ್ರಾಮ – ಆಡಳಿತ ಘಟಕಗಳಲ್ಲಿ ಅತ್ಯಂತ ಚಿಕ್ಕದು; ಗ್ರಾಮ ಮುಖ್ಯಸ್ಥರು ಲೆಕ್ಕಪತ್ರಗಳ ವಹಿವಾಟನ್ನು ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದರು'], highlight: 'ಚಾಳುಕ್ಯರು ಸುಮಾರು 200 ವರ್ಷಗಳ ಕಾಲ ಆಡಳಿತ ನಡೆಸಿದರು.' },
    { type: 'content', heading: 'ಚಾಳುಕ್ಯರ ಕಾಲದ ಧರ್ಮ', imageQuery: 'Meguti Jain temple Aihole', points: ['ಚಾಳುಕ್ಯರು ಶೈವ, ವೈಷ್ಣವ, ಜೈನ ಮುಂತಾದ ಎಲ್ಲ ಪಂಥಗಳ ಸಂಪ್ರದಾಯಗಳನ್ನು ಪ್ರೋತ್ಸಾಹಿಸಿದರು.', 'ಜೈನ ದೇವಾಲಯಗಳ ನಿರ್ಮಾಣಕ್ಕೆ ಇವರು ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರು.', 'ಬೌದ್ಧ ವಿಹಾರಗಳೂ ಕೂಡ ಪ್ರೋತ್ಸಾಹಿಸಲ್ಪಟ್ಟವು.'] },
    { type: 'content', heading: 'ಚಾಳುಕ್ಯರ ಕಾಲದ ಸಾಹಿತ್ಯ', imageQuery: 'Kappe Arabhatta inscription Badami', points: ['ಬಾದಾಮಿಯ ಚಾಳುಕ್ಯರು ಸಾಹಿತ್ಯಕ್ಕೆ ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರು. ಕನ್ನಡ ಹಾಗೂ ಸಂಸ್ಕೃತ ಭಾಷೆಗಳು ಚೆನ್ನಾಗಿ ಬೆಳೆದವು.', 'ಕನ್ನಡವು ಅವರ ದೇಶ ಭಾಷೆಯಾಗಿತ್ತು.', 'ಈ ಕಾಲದ ಕಾವ್ಯದಲ್ಲಿ ತ್ರಿಪದಿ ಶೈಲಿಯು ಬೆಳವಣಿಗೆಯಾಯಿತು.', 'ಕನ್ನಡದಲ್ಲಿ ಕೃತಿಗಳು ಇಲ್ಲವಾದರೂ ಅನೇಕ ಶಾಸನಗಳು ಕನ್ನಡದಲ್ಲಿ ಬರೆಯಲ್ಪಟ್ಟಿವೆ.', 'ಬಾದಾಮಿಯ ಕಪ್ಪೆ ಅರಭಟ್ಟನ ಶಾಸನದ ಒಂದು ಪದ್ಯವು ತ್ರಿಪದಿ ಶೈಲಿಯಲ್ಲಿರುವುದು ಕಂಡುಬರುತ್ತದೆ.'] },
    { type: 'quote', heading: 'ಕಪ್ಪೆ ಅರಭಟ್ಟನ ಶಾಸನದ ತ್ರಿಪದಿ ಪದ್ಯ', lines: ['ಸಾಧುಂಗೆ ಸಾಧು ಮಾಧುರ್ಯಂಗೆ ಮಾಧುರ್ಯಂ', 'ಬಾಧಿಪ್ಪ ಕಲಿಗೆ ಕಲಿಯುಗ ವಿಪರೀತನ್', 'ಮಾಧವನೀತನ್ ಪೆರನಲ್ಲ'], explain: 'ಅರ್ಥ: ಒಳ್ಳೆಯವರಿಗೆ ಒಳ್ಳೆಯವನು. ಮಧುರಗುಣ ಉಳ್ಳವರಿಗೆ ಮಧುರವಾಗಿ ವರ್ತಿಸುವವನು. ತೊಂದರೆಪಡಿಸುವ ದುಷ್ಟರಿಗೆ ದುಷ್ಟನಂತೆ ಕಾಣಿಸುವವನು. ಈತನು ಅಸಾಮಾನ್ಯನಾದ ಮಾಧವನೇ ಆಗಿರುವವನು.', notes: 'ಪದ್ಯವನ್ನು ರಾಗವಾಗಿ ಓದಿ, ಮಕ್ಕಳಿಂದ ಪುನರುಚ್ಚರಿಸಿ. ತ್ರಿಪದಿ = ಮೂರು ಪಾದಗಳ ಪದ್ಯ.' },
    { type: 'keywords', heading: 'ಸಂಸ್ಕೃತ ವಿದ್ವಾಂಸರು ಮತ್ತು ನಾಟಕಗಳು', points: ['ರವಿಕೀರ್ತಿ, ವಿಜ್ಜಿಕ, ಅಕಳಂಕ – ಈ ಕಾಲದ ಸಂಸ್ಕೃತ ವಿದ್ವಾಂಸರು', 'ವಿಜ್ಜಿಕ – ಎರಡನೇ ಪುಲಕೇಶಿಯ ಸೊಸೆಯಾದ ಕವಯಿತ್ರಿ; ‘ಕೌಮುದೀ ಮಹೋತ್ಸವ’ ಬರೆದವಳು', 'ಶಿವಭಟ್ಟಾರಕ – ‘ಹರ ಪಾರ್ವತೀಯ’ ಬರೆದವನು', '‘ಕೌಮುದೀ ಮಹೋತ್ಸವ’, ‘ಹರ ಪಾರ್ವತೀಯ’ – ಮುಖ್ಯವಾದ ಸಂಸ್ಕೃತ ನಾಟಕಗಳು'] },
    { type: 'content', heading: 'ಕಲೆ ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪ', imageQuery: 'Badami cave temple sculpture', points: ['ಬಾದಾಮಿಯ ಚಾಳುಕ್ಯರು ಮಹಾನ್ ನಿರ್ಮಾಪಕರು ಹಾಗೂ ಕಲಾ ಪ್ರೇಮಿಗಳೂ ಆಗಿದ್ದರು.', 'ಬಾದಾಮಿ, ಐಹೊಳೆ, ಪಟ್ಟದಕಲ್ಲುಗಳಲ್ಲಿ ಸೊಗಸಾದ ಅತ್ಯುತ್ಕೃಷ್ಟವಾದ ದೇವಾಲಯಗಳನ್ನು ನಿರ್ಮಿಸಿದರು.', 'ಇವರು ‘ಚಾಳುಕ್ಯ ಶೈಲಿ’ ಅಥವಾ ‘ವೇಸರ ಶೈಲಿ’ ಎಂಬ ವಿಶಿಷ್ಟ ಶಿಲ್ಪಕಲಾ ಶೈಲಿಯನ್ನು ಭಾರತೀಯ ವಾಸ್ತುಶಿಲ್ಪದಲ್ಲಿ ಪ್ರಾರಂಭಿಸಿದರು.', 'ಬಾದಾಮಿಯಲ್ಲಿರುವ ಶಿಲೆಯಲ್ಲಿ ಕೊರೆದ ಗುಹಾಂತರ ದೇವಾಲಯಗಳನ್ನು ಇವರು ನಿರ್ಮಿಸಿದರು.', 'ಅನೇಕ ಕಲಾವಿದರು ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪ ಕಲಾಕಾರರಿಗೆ ಇವರು ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರು.'] },
    { type: 'content', heading: 'ಐಹೊಳೆ ಮತ್ತು ಪಟ್ಟದಕಲ್ಲು', imageQuery: 'Durga temple Aihole', points: ['ಚಾಳುಕ್ಯ ಶೈಲಿಯ ಅತ್ಯುತ್ತಮ ದೇವಾಲಯಗಳು ಐಹೊಳೆ ಮತ್ತು ಪಟ್ಟದಕಲ್ಲಿನಲ್ಲಿವೆ.', 'ದೇವಾಲಯ ವಾಸ್ತುಶಿಲ್ಪದ ತೊಟ್ಟಿಲುಗಳಲ್ಲಿ ಐಹೊಳೆಯು ಒಂದಾಗಿದೆ.', 'ದೇವಾಲಯ ವಾಸ್ತುಶಿಲ್ಪದ ಕ್ರಮ ಸರಣಿಯ ವಿಕಾಸದಲ್ಲಿನ ಪ್ರಯೋಗಗಳನ್ನು ಇಲ್ಲಿ ನಡೆಸಲಾಯಿತು.', 'ಈ ಶೈಲಿಯು ಪಟ್ಟದಕಲ್ಲಿನಲ್ಲಿ ಸಂಪೂರ್ಣ ವಿಕಾಸ ಹೊಂದಿತು.'] },
    { type: 'content', heading: 'ಪ್ರಸಿದ್ಧ ದೇವಾಲಯಗಳು ಮತ್ತು ವಿಗ್ರಹಗಳು', imageQuery: 'Virupaksha Temple Pattadakal', points: ['ಪಟ್ಟದಕಲ್ಲಿನಲ್ಲಿ ಲೋಕೇಶ್ವರ (ವಿರೂಪಾಕ್ಷ) ಮತ್ತು ತ್ರೈಲೋಕೇಶ್ವರ (ಮಲ್ಲಿಕಾರ್ಜುನ) ಮುಂತಾದ ಪ್ರಸಿದ್ಧ ದೇವಾಲಯಗಳನ್ನು ಕಾಣಬಹುದು.', 'ಬಾದಾಮಿಯ ಗುಹೆಗಳಲ್ಲಿರುವ ವಿಷ್ಣು, ವರಾಹ, ಹರಿಹರ, ಅರ್ಧನಾರೀಶ್ವರರ ಎತ್ತರದ ವಿಗ್ರಹಗಳು ಚಾಳುಕ್ಯರ ಕಲಾತ್ಮಕ ಸಾಧನೆಯ ಅತ್ಯುತ್ತಮ ಕುರುಹುಗಳಾಗಿವೆ.', 'ಚಿತ್ರಕಲೆಗೂ ಇಲ್ಲಿ ಪ್ರೋತ್ಸಾಹ ಸಿಕ್ಕಿತು.'], notes: 'ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರ: ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ, ಪಟ್ಟದಕಲ್ಲು (ಪುಟ 21).' },
    { type: 'section', heading: 'ಕಂಚಿಯ ಪಲ್ಲವರು', subtitle: 'ಸಾ.ಶ. 350 – 895' },
    { type: 'content', heading: 'ಕಂಚಿಯ ಪಲ್ಲವರು – ಪರಿಚಯ', imageQuery: 'Kanchipuram Kailasanathar temple', points: ['ಪಲ್ಲವರು ತಮಿಳುನಾಡಿನ ಪ್ರಪ್ರಥಮ ರಾಜರುಗಳು. ದಕ್ಷಿಣ ಭಾರತವನ್ನು ಆಳಿದ ವಂಶಗಳಲ್ಲಿ ಇವರಿಗೆ ವಿಶೇಷ ಸ್ಥಾನವಿದೆ.', 'ಸಾ.ಶ. 4ನೇ ಶತಮಾನದಿಂದ ಸಾ.ಶ. 9ನೇ ಶತಮಾನದವರೆಗೆ ಆಳಿದರು.', 'ಪ್ರಾರಂಭದಲ್ಲಿ ಇವರು ಶಾತವಾಹನರ ಅಧಿಕಾರಿಗಳಾಗಿದ್ದರು. ಶಾತವಾಹನ ರಾಜ್ಯವು ಅವನತಿಯಾದಾಗ ಪಲ್ಲವರು ತಮ್ಮನ್ನು ತಾವೇ ಸ್ಥಳೀಯ ರಾಜರುಗಳೆಂದು ಘೋಷಿಸಿಕೊಂಡರು.', 'ಶಿವಸ್ಕಂದವರ್ಮನು ಈ ಸಂತತಿಯ ಮೊದಲ ದೊರೆ ಹಾಗೂ ಈ ವಂಶದ ಆಳ್ವಿಕೆಯ ಸ್ಥಾಪಕನು.'] },
    { type: 'content', heading: 'ಚಾಳುಕ್ಯ – ಪಲ್ಲವ ಸಂಘರ್ಷ', points: ['ಪಲ್ಲವರು ಮತ್ತು ಕದಂಬರು ನಿರಂತರ ವೈರ ಹೊಂದಿದ್ದರು.', 'ಚಾಳುಕ್ಯ ವಂಶದ ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯು ಪಲ್ಲವರ ಮಹೇಂದ್ರವರ್ಮನನ್ನು ಸೋಲಿಸಿದನು.', 'ಮುಂದೆ ಬಂದ ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮನು ಪಲ್ಲವ ರಾಜರುಗಳಲ್ಲಿ ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧನು.', 'ತನಗೆ ಚಾಳುಕ್ಯರ ಮೇಲಿದ್ದ ಸೇಡನ್ನು ತೀರಿಸಿಕೊಂಡು, ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯನ್ನು ಸೋಲಿಸಿ ವಾತಾಪಿಯನ್ನು ವಶಪಡಿಸಿಕೊಂಡನು.'] },
    { type: 'content', heading: 'ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮ', imageQuery: 'Mahabalipuram monuments', highlight: 'ಬಿರುದುಗಳು: ‘ಮಹಾಮಲ್ಲ’ ಮತ್ತು ‘ವಾತಾಪಿಕೊಂಡ’', points: ['ಈತನು ‘ಮಹಾಮಲ್ಲ’ ಮತ್ತು ‘ವಾತಾಪಿಕೊಂಡ’ ಎಂಬ ಬಿರುದುಗಳನ್ನು ಹೊಂದಿದ್ದನು.', 'ಈತನ ಆಳ್ವಿಕೆಯ ಕಾಲದಲ್ಲಿ ಹ್ಯೂಯೆನ್‌ತ್ಸಾಂಗನು ಕಂಚಿಗೆ ಭೇಟಿ ನೀಡಿದ್ದನು.', 'ಕಂಚಿ ಬಳಿಯಲ್ಲಿನ ಸಮುದ್ರ ತೀರದಲ್ಲಿ ನರಸಿಂಹವರ್ಮನು ಒಂದು ನಗರವನ್ನು ನಿರ್ಮಿಸಿ, ಅದಕ್ಕೆ ‘ಮಹಾಬಲಿಪುರಂ’ ಎಂಬ ಹೆಸರನ್ನು ಇಟ್ಟನು.', 'ಅನೇಕ ಏಕಶಿಲಾ ದೇವಾಲಯಗಳು ಈತನಿಂದ ನಿರ್ಮಾಣವಾದವು.', 'ಅಪರಾಜಿತ ಪಲ್ಲವನ ಆಳ್ವಿಕೆಯ ಕಾಲದಲ್ಲಿ ಪಲ್ಲವ ಸಾಮ್ರಾಜ್ಯ ಚೋಳರ ಆದಿತ್ಯನಿಂದ ಕೊನೆಗೊಂಡಿತು.'] },
    { type: 'content', heading: 'ಪಲ್ಲವರ ಕೊಡುಗೆಗಳು – ಆಡಳಿತ', points: ['ಪಲ್ಲವರು ತಮಿಳುನಾಡಿನಲ್ಲಿ ಆಡಳಿತವನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸಿದ್ದರು.', 'ಸಾಹಿತ್ಯ, ಧರ್ಮ, ಕಲೆ ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪ ಹಾಗೂ ಶಿಕ್ಷಣಗಳಲ್ಲಿ ಇವರ ಕಾಣಿಕೆಯು ಗಮನಾರ್ಹವಾದುದು.', 'ವಾತಾಪಿಯಲ್ಲಿ ಚಾಳುಕ್ಯರೂ, ಕಂಚಿಯಲ್ಲಿ ಪಲ್ಲವರೂ ಆಳುತ್ತಿದ್ದ ಕಾಲವೇ ದಕ್ಷಿಣದಲ್ಲಿ ವೀರಯುಗ.', 'ಇವರ ರಾಜ್ಯವು ಸದೃಢ, ಸುವ್ಯವಸ್ಥಿತವಾಗಿದ್ದು, ಮಂತ್ರಿ ಮತ್ತು ಪ್ರಾಂತಾಧಿಕಾರಿಗಳಿದ್ದರು.'] },
    { type: 'flow', heading: 'ಪಲ್ಲವರ ಆಡಳಿತ ವಿಭಾಗಗಳು', points: ['ರಾಜ್ಯ – ಮಂತ್ರಿ ಮತ್ತು ಪ್ರಾಂತಾಧಿಕಾರಿಗಳಿದ್ದರು', 'ಮಂಡಲ – ರಾಜ್ಯದ ದೊಡ್ಡ ವಿಭಾಗ', 'ನಾಡು – ಮಂಡಲದ ಉಪವಿಭಾಗ', 'ಗ್ರಾಮ – ಗ್ರಾಮ ಸಭೆಯು ಗ್ರಾಮದ ಸಮಸ್ಯೆಗಳನ್ನು ಗಮನಿಸುತ್ತಿತ್ತು; ಗ್ರಾಮಭೋಜಕ ಗ್ರಾಮದ ಆಡಳಿತ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದನು'], highlight: 'ರಾಜ್ಯವನ್ನು ಮಂಡಲ, ನಾಡು ಮತ್ತು ಗ್ರಾಮಗಳಾಗಿ ವಿಭಾಗಿಸಿದ್ದರು.' },
    { type: 'keywords', heading: 'ಪಲ್ಲವರ ಕಾಲದ ಸಾಹಿತ್ಯ', highlight: 'ಪಲ್ಲವರು ಸಂಸ್ಕೃತ ಮತ್ತು ತಮಿಳು ಭಾಷೆಗಳೆರಡಕ್ಕೂ ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರು. ಕಂಚಿಯು ಸಂಸ್ಕೃತ ಸಾಹಿತ್ಯದ ಕೇಂದ್ರವಾಗಿತ್ತು.', points: ['ಭಾರವಿ – ಪಲ್ಲವರ ಆಸ್ಥಾನ ಕವಿ; ‘ಕಿರಾತಾರ್ಜುನೀಯ’ ಕೃತಿಯ ಕರ್ತೃ', 'ದಂಡಿ – ಪಲ್ಲವರ ಆಸ್ಥಾನ ಕವಿ; ‘ದಶಕುಮಾರ ಚರಿತ’ ಕೃತಿಯ ಕರ್ತೃ', 'ರಾಜ ಮಹೇಂದ್ರವರ್ಮ – ಸ್ವತಃ ‘ಮತ್ತ ವಿಲಾಸ ಪ್ರಹಸನ’ ಎಂಬ ಸಾಮಾಜಿಕ ನಾಟಕವನ್ನು ಹಾಗೂ ‘ಭಗವದಜ್ಜುಕಂ’ ಗ್ರಂಥವನ್ನು ರಚಿಸಿದ್ದಾನೆ'] },
    { type: 'content', heading: 'ಪಲ್ಲವರ ಕಾಲದ ಧರ್ಮ', points: ['ಪಲ್ಲವರು ಎಲ್ಲಾ ಧರ್ಮಗಳಿಗೂ ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರು.', 'ಮೊದಲು ಪಲ್ಲವ ದೊರೆಗಳು ಬೌದ್ಧಧರ್ಮೀಯರಾಗಿದ್ದರು.', 'ನಳಂದ ವಿದ್ಯಾನಿಲಯದ ಮಹಾನ್ ವಿದ್ವಾಂಸ ಧರ್ಮಪಾಲನು ಕಂಚಿಯಲ್ಲಿ ಜನಿಸಿದವನು.', 'ಮಹೇಂದ್ರವರ್ಮನು ಜೈನ ಧರ್ಮಾವಲಂಬಿಯಾದುದರಿಂದ ನಾಡಿನಲ್ಲಿ ಅನೇಕ ಜೈನರಿದ್ದರು.'] },
    { type: 'compare', heading: 'ಭಕ್ತಿ ಚಳುವಳಿ – ಶೈವ ಮತ್ತು ವೈಷ್ಣವ', left: { title: 'ನಾಯನ್ನಾರರು', points: ['63 ಯತಿ ಶ್ರೇಷ್ಠರು', 'ಶೈವ ಮತವನ್ನು ಪ್ರಚಾರಗೊಳಿಸಿದರು'] }, right: { title: 'ಆಳ್ವಾರರು', points: ['12 ಮಂದಿ ಆಳ್ವಾರರುಗಳು', 'ವೈಷ್ಣವ ಮತವನ್ನು ಪ್ರಚಾರಗೊಳಿಸಿದರು'] }, highlight: '7ನೇ ಶತಮಾನದಲ್ಲಿ ಶೈವ – ವೈಷ್ಣವ ಭಕ್ತಿ ಪಂಥಗಳು ಜನಪ್ರಿಯವಾದವು.' },
    { type: 'content', heading: 'ಭಕ್ತಿ ಚಳುವಳಿಯ ಪರಿಣಾಮ', points: ['ಈ ಯುಗವು ಭಕ್ತಿ ಚಳುವಳಿಯ ಉದಯವನ್ನು ಕಂಡಿತು.', 'ವೈದಿಕ ಧರ್ಮದ ಪುನರುಜ್ಜೀವನಕ್ಕೂ ಸಹಾಯ ಮಾಡಿತು.', 'ತಮಿಳಿನಲ್ಲಿ ಶ್ಲೋಕಗಳು ರಚನೆಯಾದವು. ಇದೇ ತಮಿಳು ಸಾಹಿತ್ಯದ ನಿಧಿಯಾಗಿದೆ.'] },
    { type: 'content', heading: 'ಪಲ್ಲವರ ಕಲೆ ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪ', imageQuery: 'Pancha Rathas Mahabalipuram', points: ['ಪಲ್ಲವರು ಕಲೆ ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪದ ಪ್ರೇಮಿಗಳಾಗಿದ್ದರು. ತಮ್ಮ ರಾಜ್ಯದಲ್ಲಿ ಇವರು ಅನೇಕ ದೇವಾಲಯಗಳನ್ನು ನಿರ್ಮಿಸಿದರು.', 'ಈ ದೇವಾಲಯಗಳಲ್ಲಿ ಅತ್ಯುತ್ತಮ ಕಲಾಕೌಶಲತೆಯನ್ನು ಕಾಣಬಹುದು.', 'ಪಲ್ಲವರ ವಾಸ್ತುಶಿಲ್ಪವನ್ನು ಕಲ್ಲಿನಲ್ಲಿ ಕೊರೆದು ಮಾಡಿದ ದೇವಾಲಯಗಳು ಮತ್ತು ರಚನಾ ವಿನ್ಯಾಸದ ದೇವಾಲಯಗಳು ಎಂಬುದಾಗಿ ವಿಂಗಡಿಸಬಹುದು.'], notes: 'ಪಠ್ಯಪುಸ್ತಕದ ಚಿತ್ರ: ಮಹಾಬಲಿಪುರ ಪಂಚರಥಗಳು (ಪುಟ 23).' },
    { type: 'content', heading: 'ಮಹಾಬಲಿಪುರದ ಶಿಲ್ಪಕಲೆ', imageQuery: "Arjuna's Penance Mahabalipuram", points: ['ಮಹಾಬಲಿಪುರದಲ್ಲಿ ಕಲ್ಲಿನಲ್ಲಿ ಕೊರೆದು ಮಾಡಿದ ಅನೇಕ ದೇವಾಲಯಗಳನ್ನು ಕಾಣಬಹುದು.', 'ಏಕಶಿಲೆಗಳಲ್ಲಿ ಅದ್ಭುತ ವಿಗ್ರಹಗಳನ್ನು ಕೆತ್ತಿ, ಬಿಡಿಸಲಾಗಿದೆ. ಇವುಗಳು ಮಹಾಭಾರತದ ಹಾಗೂ ಭಾಗವತದ ಕಥೆಗಳನ್ನು ಹೊಂದಿವೆ.', 'ಇಲ್ಲಿನ ಪಂಚ ರಥಗಳು ಸುಪ್ರಸಿದ್ಧ ಏಕಶಿಲಾ ದೇವಾಲಯಗಳಾಗಿವೆ.', '‘ಅರ್ಜುನನ ತಪಸ್ಸು’ ಎನ್ನುವ ಕೆತ್ತನೆ ದೃಶ್ಯವು ಅತ್ಯುತ್ತಮ ಕಲಾಕೃತಿಯಾಗಿದೆ.'] },
    { type: 'content', heading: 'ಪ್ರಾಚೀನ ವಾಸ್ತುಶಿಲ್ಪದ ಅತ್ಯುತ್ತಮ ನಿದರ್ಶನಗಳು', imageQuery: 'Shore Temple Mahabalipuram', points: ['ಕಂಚಿಯಲ್ಲಿನ ಕೈಲಾಸನಾಥ, ಏಕಾಂಬರನಾಥ ಮತ್ತು ವೈಕುಂಠ ಪೆರುಮಾಳರ ದೇವಾಲಯಗಳು', 'ಮಹಾಬಲಿಪುರದ ಕಡಲದಂಡೆಯ ದೇವಾಲಯ', 'ಇವು ಪ್ರಾಚೀನ ಭಾರತ ವಾಸ್ತುಶಿಲ್ಪದ ಅತ್ಯುತ್ತಮ ನಿದರ್ಶನಗಳಾಗಿವೆ.'] },
    { type: 'content', heading: 'ದೇವಾಲಯಗಳು – ಸಾಮಾಜಿಕ, ಶೈಕ್ಷಣಿಕ ಕೇಂದ್ರಗಳು', imageQuery: 'Ekambareswarar Temple Kanchipuram', points: ['ದೇವಾಲಯಗಳು ಧಾರ್ಮಿಕ ಹಾಗೂ ಕಲಾತ್ಮಕ ಚಟುವಟಿಕೆಗಳ ಕೇಂದ್ರಗಳಾದವು.', 'ದೇವಾಲಯದ ಅಂಗಳಗಳಲ್ಲಿ ಸಂಜೆ ಸಮಯದಲ್ಲಿ ಗ್ರಾಮೀಣ ಜನರು ಕಲೆತು ಅನೇಕ ವಿಷಯಗಳನ್ನು ಚರ್ಚಿಸುತ್ತಿದ್ದರು.', 'ವಿರಾಮ ವೇಳೆಯಲ್ಲಿ ಜನರು ಇಲ್ಲಿ ಸಭೆ ಸೇರುತ್ತಿದ್ದು ಹಾಗೂ ಪುರಾಣ ಕೇಳುವುದು ಮತ್ತು ಭಕ್ತಿ ಗೀತೆಗಳನ್ನು ಹಾಡುತ್ತಿದ್ದರು.', 'ಹೀಗಾಗಿ ದೇವಾಲಯಗಳು ಸಾಮಾಜಿಕ, ಶೈಕ್ಷಣಿಕ ಕೇಂದ್ರಗಳಾಗಿದ್ದವು.'] },
    { type: 'content', heading: 'ನೌಕಾಬಲ ಮತ್ತು ವಿದೇಶಿ ವ್ಯಾಪಾರ', imageQuery: 'Southeast Asia map', points: ['ಪಲ್ಲವರು ಒಳ್ಳೆಯ ನೌಕಾಬಲವನ್ನು ಹೊಂದಿದ್ದರು.', 'ಇಲ್ಲಿನ ವರ್ತಕರು ಮಲಯ, ಇಂಡೋನೇಷಿಯಾ ಹಾಗೂ ಇತರ ಆಗ್ನೇಯ ಏಷ್ಯಾ ರಾಷ್ಟ್ರಗಳೊಡನೆ ವಾಣಿಜ್ಯ ಸಂಬಂಧಗಳನ್ನು ಹೊಂದಿದ್ದರು.', 'ಭಾರತೀಯ ಭಾಷೆ, ಧರ್ಮ, ಸಂಪ್ರದಾಯ, ಸಂಸ್ಕೃತಿಗಳು ಆ ದೇಶಗಳಲ್ಲಿಯೂ ಪ್ರಭಾವ ಬೀರಿರುವುದನ್ನು ಕಾಣಬಹುದು.'] },
    { type: 'timeline', heading: 'ಕಾಲರೇಖೆ', points: ['ಸಾ.ಶ. 350 – ಕಂಚಿಯ ಪಲ್ಲವರ ಆಳ್ವಿಕೆ ಆರಂಭ', 'ಸಾ.ಶ. 540 – ಬಾದಾಮಿಯ ಚಾಳುಕ್ಯರ ಆಳ್ವಿಕೆ ಆರಂಭ', '7ನೇ ಶತಮಾನ – ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ, ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮ; ಭಕ್ತಿ ಪಂಥಗಳು ಜನಪ್ರಿಯ', 'ಸಾ.ಶ. 753 – ರಾಷ್ಟ್ರಕೂಟರಿಂದ ಚಾಳುಕ್ಯ ಸಾಮ್ರಾಜ್ಯದ ಅಂತ್ಯ', 'ಸಾ.ಶ. 895 – ಚೋಳರ ಆದಿತ್ಯನಿಂದ ಪಲ್ಲವ ಸಾಮ್ರಾಜ್ಯದ ಅಂತ್ಯ'] },
    { type: 'compare', heading: 'ಹೋಲಿಸಿ ನೋಡೋಣ', left: { title: 'ಬಾದಾಮಿಯ ಚಾಳುಕ್ಯರು', points: ['ಕಾಲ: ಸಾ.ಶ. 540 – 753', 'ಸ್ಥಾಪಕ: ಜಯಸಿಂಹ', 'ಪ್ರಸಿದ್ಧ ದೊರೆ: ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ', 'ಆಡಳಿತ: ವಿಷಯ (ಜಿಲ್ಲೆ), ಗ್ರಾಮ', 'ಶೈಲಿ: ಚಾಳುಕ್ಯ / ವೇಸರ ಶೈಲಿ', 'ಕೇಂದ್ರಗಳು: ಬಾದಾಮಿ, ಐಹೊಳೆ, ಪಟ್ಟದಕಲ್ಲು'] }, right: { title: 'ಕಂಚಿಯ ಪಲ್ಲವರು', points: ['ಕಾಲ: ಸಾ.ಶ. 350 – 895', 'ಸ್ಥಾಪಕ: ಶಿವಸ್ಕಂದವರ್ಮ', 'ಪ್ರಸಿದ್ಧ ದೊರೆ: ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮ', 'ಆಡಳಿತ: ಮಂಡಲ, ನಾಡು, ಗ್ರಾಮ', 'ಶೈಲಿ: ಕಲ್ಲಿನಲ್ಲಿ ಕೊರೆದ ಮತ್ತು ರಚನಾ ದೇವಾಲಯಗಳು', 'ಕೇಂದ್ರಗಳು: ಕಂಚಿ, ಮಹಾಬಲಿಪುರ'] } },
    { type: 'keywords', heading: 'ಪ್ರಮುಖ ಪದಗಳು ಮತ್ತು ಬಿರುದುಗಳು', points: ['ದಕ್ಷಿಣಾ ಪಥೇಶ್ವರ – ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯ ಬಿರುದು', 'ಕರ್ಣಾಟಬಲ – ಬಾದಾಮಿ ಚಾಳುಕ್ಯರ ಸೈನ್ಯದ ಹೆಸರು', 'ವೇಸರ ಶೈಲಿ – ಚಾಳುಕ್ಯರು ಪ್ರಾರಂಭಿಸಿದ ಶಿಲ್ಪಕಲಾ ಶೈಲಿ', 'ತ್ರಿಪದಿ – ಈ ಕಾಲದಲ್ಲಿ ಬೆಳೆದ ಕನ್ನಡ ಕಾವ್ಯ ಶೈಲಿ', 'ಮಹಾಮಲ್ಲ, ವಾತಾಪಿಕೊಂಡ – ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮನ ಬಿರುದುಗಳು', 'ಗ್ರಾಮಭೋಜಕ – ಪಲ್ಲವರ ಕಾಲದಲ್ಲಿ ಗ್ರಾಮದ ಆಡಳಿತ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದವನು'] },
    { type: 'questions', heading: 'ಅಭ್ಯಾಸ I – ಸೂಕ್ತ ಪದಗಳಿಂದ ಪೂರ್ಣಗೊಳಿಸಿ', points: ['ಇಮ್ಮಡಿ ಪುಲಕೇಶಿಯು ಸೋಲಿಸಿದ ಪಲ್ಲವರ ದೊರೆ ________ .', 'ಬಾದಾಮಿಯ ಚಾಳುಕ್ಯರ ಸೈನ್ಯಕ್ಕೆ ________ ಎಂಬ ಹೆಸರಿತ್ತು.', '‘ಹರ ಪಾರ್ವತೀಯ’ ಸಂಸ್ಕೃತ ನಾಟಕದ ಕರ್ತೃ ________ .', '‘ವಾತಾಪಿಕೊಂಡ’ ಎಂಬ ಬಿರುದು ಪಡೆದ ಪಲ್ಲವರ ರಾಜ ________ .', '‘ಅರ್ಜುನನ ತಪಸ್ಸು’ ಎಂಬ ಕಲಾಕೃತಿಯು ________ ದಲ್ಲಿದೆ.'], notes: 'ಉತ್ತರಗಳು: 1) ಮಹೇಂದ್ರವರ್ಮ  2) ಕರ್ಣಾಟಬಲ  3) ಶಿವಭಟ್ಟಾರಕ  4) ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮ  5) ಮಹಾಬಲಿಪುರ' },
    { type: 'questions', heading: 'ಅಭ್ಯಾಸ II – ಸಂಕ್ಷಿಪ್ತವಾಗಿ ಉತ್ತರಿಸಿ', points: ['ಎರಡನೇ ಪುಲಕೇಶಿಯು ಸಾಮ್ರಾಜ್ಯವನ್ನು ಹೇಗೆ ವಿಸ್ತರಿಸಿದನು?', 'ಬಾದಾಮಿಯ ಚಾಳುಕ್ಯರ ಆಡಳಿತ ವ್ಯವಸ್ಥೆ ಬಗ್ಗೆ ತಿಳಿಸಿ.', 'ಬಾದಾಮಿ ಚಾಳುಕ್ಯರು ಸಾಹಿತ್ಯ ಪ್ರಿಯರು ಎನ್ನುವುದನ್ನು ಉದಾಹರಣೆ ಸಹಿತ ವಿವರಿಸಿ.', 'ಸಂಸ್ಕೃತ ಮತ್ತು ತಮಿಳು ಭಾಷೆಗಳಿಗೆ ಪಲ್ಲವರು ಯಾವ ರೀತಿ ಪ್ರೋತ್ಸಾಹ ನೀಡಿದರು?', 'ಕಲೆ ಮತ್ತು ವಾಸ್ತುಶಿಲ್ಪಕ್ಕೆ ಪಲ್ಲವರ ಕೊಡುಗೆಗಳನ್ನು ವಿವರಿಸಿ.'] },
    { type: 'activity', heading: 'ಚಟುವಟಿಕೆಗಳು ಮತ್ತು ಯೋಜನೆಗಳು', points: ['ಕನ್ನಡ ಭಾಷೆಗೆ ಬಾದಾಮಿ ಚಾಳುಕ್ಯರ ಕೊಡುಗೆಗಳೇನೆಂಬುದನ್ನು ಗುಂಪಿನಲ್ಲಿ ಚರ್ಚಿಸಿ.', 'ತ್ರಿಪದಿಯ ಬಗ್ಗೆ ಕನ್ನಡ ಭಾಷಾ ಶಿಕ್ಷಕರು ಮತ್ತು ಕನ್ನಡ ಪುಸ್ತಕಗಳಿಂದ ಹೆಚ್ಚಿನ ಮಾಹಿತಿಯನ್ನು ಸಂಗ್ರಹಿಸಿ.', 'ಕಂಚಿಪುರ – ಮಹಾಬಲಿಪುರ ಪ್ರದೇಶಗಳಿಗೆ ಒಂದು ಶೈಕ್ಷಣಿಕ ಪ್ರವಾಸವನ್ನು ಏರ್ಪಡಿಸುವುದು.', 'ಯೋಜನೆ: ಯಾವುದಾದರೂ ಸ್ಥಳೀಯ ಐತಿಹಾಸಿಕ ಸ್ಥಳಗಳಿಗೆ ಭೇಟಿ ನೀಡಿ ವಿಷಯ ಸಂಗ್ರಹಿಸಿ.', 'ಯೋಜನೆ: ಬಾದಾಮಿ, ಐಹೊಳೆ ಮತ್ತು ಪಟ್ಟದಕಲ್ಲಿನಲ್ಲಿರುವ ಪ್ರಮುಖ ದೇವಾಲಯಗಳ ಚಿತ್ರ ಬಿಡಿಸಿ ಒಂದು ಆಲ್ಬಂ ತಯಾರಿಸಿ.'] },
    { type: 'summary', heading: 'ಸಾರಾಂಶ', points: ['ಬಾದಾಮಿ ಚಾಳುಕ್ಯರು (540–753): ಸ್ಥಾಪಕ ಜಯಸಿಂಹ; ಶ್ರೇಷ್ಠ ದೊರೆ ಇಮ್ಮಡಿ ಪುಲಕೇಶಿ', 'ಕರ್ಣಾಟಬಲ ಸೈನ್ಯ; ವಿಷಯ–ಗ್ರಾಮ ಆಡಳಿತ; ಎಲ್ಲಾ ಧರ್ಮಗಳಿಗೆ ಪ್ರೋತ್ಸಾಹ', 'ಕನ್ನಡ ಶಾಸನಗಳು, ತ್ರಿಪದಿ; ವೇಸರ ಶೈಲಿಯ ದೇವಾಲಯಗಳು', 'ಕಂಚಿಯ ಪಲ್ಲವರು (350–895): ಶಿವಸ್ಕಂದವರ್ಮ ಸ್ಥಾಪಕ; ಪ್ರಥಮ ನರಸಿಂಹವರ್ಮ ಪ್ರಸಿದ್ಧ', 'ಸಂಸ್ಕೃತ–ತಮಿಳು ಸಾಹಿತ್ಯ, ಭಕ್ತಿ ಚಳುವಳಿ (ನಾಯನ್ನಾರರು, ಆಳ್ವಾರರು)', 'ಮಹಾಬಲಿಪುರ, ಕಂಚಿಯ ದೇವಾಲಯಗಳು; ನೌಕಾಬಲ ಮತ್ತು ಆಗ್ನೇಯ ಏಷ್ಯಾ ವ್ಯಾಪಾರ'] },
